EXP_NAME: 'demo_train'
PROJECT_NAME: 'DECO_demo_training'
OUTPUT_DIR: 'deco_results'
CONDOR_DIR: ''
DATASET:
  BATCH_SIZE: 4    # 4
  NUM_WORKERS: 8
  NORMALIZE_IMAGES: [True]
OPTIMIZER:
  TYPE: 'adam'
  LR: [1e-5]
  NUM_UPDATE_LR: 3
TRAINING:
  ENCODER: 'sam_hrnet'    # 'hrnet'
  CONTEXT: [True]
  NUM_EPOCHS: 60  # 30
  NUM_EARLY_STOP: 10
  SUMMARY_STEPS: 5
  CHECKPOINT_EPOCHS: 5
  DATASETS: ['damon']
  DATASET_MIX_PDF: ['1.0'] # should sum to 1.0 unless you want to weight by dataset size
  DATASET_ROOT_PATH: '/home/l_z80934/scratch/deco'    # ''
  BEST_MODEL_PATH: './checkpoints/deco_best.pth'
  LOSS_WEIGHTS: 1.
  PAL_LOSS_WEIGHTS: 0.0   # 0.01
  DISTILL: True
  DISTILL_DINO_WEIGHT: 0.1    # feature-DINO prototype CE (the named DINO method); 0 = output-consistency only
  DISTILL_OUT_WEIGHT: 1.0     # output-consistency MSE on contact probs (on-task, primary)
  DISTILL_RAMP_STEPS: 4000    # warm distill terms 0->1 over ~first 2 epochs (tune to steps/epoch)
VALIDATION:
  SUMMARY_STEPS: 5
  DATASETS: ['damon']
  MAIN_DATASET: 'damon'
