EXP_NAME: 'demo_train'
PROJECT_NAME: 'DECO_demo_training'
OUTPUT_DIR: 'deco_results'
CONDOR_DIR: ''
DATASET:
  BATCH_SIZE: 2    # 4
  NUM_WORKERS: 8
  NORMALIZE_IMAGES: [True]
OPTIMIZER:
  TYPE: 'adam'
  LR: [1e-5]
  NUM_UPDATE_LR: 3
TRAINING:
  ENCODER: 'sam_hrnet'    # 'hrnet'
  CONTEXT: [True]
  NUM_EPOCHS: 60  # 30
  NUM_EARLY_STOP: 10
  SUMMARY_STEPS: 5
  CHECKPOINT_EPOCHS: 5
  DATASETS: ['damon']
  DATASET_MIX_PDF: ['1.0'] # should sum to 1.0 unless you want to weight by dataset size
  DATASET_ROOT_PATH: '/home/l_z80934/scratch/deco'    # ''
  BEST_MODEL_PATH: './checkpoints/demo_train_best.pth'
  LOSS_WEIGHTS: 1.
  PAL_LOSS_WEIGHTS: 0.0   # 0.01
  DISTILL: True
  DISTILL_DINO_WEIGHT: 0.2  # 0.5     # start modest; ramp up if stable   # 0 = off; the new attention-consistency term
  DISTILL_OUT_WEIGHT: 0.5
  DISTILL_OUT_DIM: 4096
  EMA_MOMENTUM: 0.996
  BACKBONE_UNFREEZE_N: 2              # fine-tune the top-2 DINOv3 blocks (fp32, dedicated lr x0.1 optimizer)
  DISTILL_BACKBONE_ATTN_WEIGHT: 0.2  # cross-view SSL on the backbone attention output (uses Q,K,V)
  DISTILL_BACKBONE_MAP_WEIGHT: 0.0   # explicit QKᵀ map-KL off (heavier; keep 0 on 12GB)
VALIDATION:
  SUMMARY_STEPS: 5
  DATASETS: ['damon']
  MAIN_DATASET: 'damon'
